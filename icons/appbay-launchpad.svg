<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4270"/>
      <stop offset="1" stop-color="#1B1E36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6C78C9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6C78C9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EEF1F6"/>
      <stop offset="1" stop-color="#BFC6D4"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B61"/>
      <stop offset="1" stop-color="#D93A3A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FD8FF"/>
      <stop offset="1" stop-color="#2F7BE0"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="0.5" stop-color="#FF9F1C"/>
      <stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M0,-150 C58,-108 64,-20 50,62 L-50,62 C-64,-20 -58,-108 0,-150 Z"/>
    </clipPath>
  </defs>

  <!-- base no estilo dos ícones Colloid -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#glow)"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="10"/>

  <!-- estrelas -->
  <g fill="#FFFFFF">
    <circle cx="118" cy="140" r="6" opacity="0.9"/>
    <circle cx="170" cy="96" r="3.5" opacity="0.6"/>
    <circle cx="392" cy="150" r="4" opacity="0.7"/>
    <circle cx="410" cy="330" r="5" opacity="0.8"/>
    <circle cx="140" cy="360" r="3.5" opacity="0.5"/>
    <circle cx="330" cy="92" r="3" opacity="0.5"/>
  </g>

  <!-- foguete, inclinado como no ícone clássico do Launchpad -->
  <g transform="translate(262,250) rotate(40) scale(1.08)">
    <path d="M-24,78 Q0,200 24,78 Z" fill="url(#flame)"/>
    <path d="M-12,78 Q0,150 12,78 Z" fill="#FFF6C2" opacity="0.9"/>
    <path d="M-50,8 L-98,74 L-94,104 L-48,72 Z" fill="url(#red)"/>
    <path d="M50,8 L98,74 L94,104 L48,72 Z" fill="url(#red)"/>
    <rect x="-34" y="58" width="68" height="22" rx="6" fill="#4A5068"/>
    <path d="M0,-150 C58,-108 64,-20 50,62 L-50,62 C-64,-20 -58,-108 0,-150 Z" fill="url(#body)"/>
    <g clip-path="url(#bodyClip)">
      <rect x="-80" y="-170" width="160" height="72" fill="url(#red)"/>
      <rect x="-80" y="30" width="160" height="10" fill="#D93A3A" opacity="0.9"/>
    </g>
    <circle cx="0" cy="-42" r="27" fill="#2B3350"/>
    <circle cx="0" cy="-42" r="19" fill="url(#glass)"/>
    <circle cx="-6" cy="-49" r="6" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>
